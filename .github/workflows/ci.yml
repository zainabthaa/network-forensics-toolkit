name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (with dev deps)
        run: pip install -e .[dev]
      - name: Run tests
        run: pytest -q
      - name: Smoke-run the CLI on the sample capture
        run: pcap-triage sample/traffic_capture.pcapng -o /tmp/report.html -j /tmp/report.json --sigma /tmp/rules.yml --stix /tmp/bundle.json --flows-csv /tmp/flows.csv
