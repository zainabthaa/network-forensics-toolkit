[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pcap-triage"
version = "1.1.0"
description = "Offline PCAP triage for web-traffic forensics: recovers credentials, audits cookies, detects auth artifacts, and exports Sigma/STIX."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Zainab Taha" }, { name = "Natali Soukh" }]
keywords = ["pcap", "forensics", "wireshark", "dfir", "security", "sigma", "stix"]
dependencies = ["scapy>=2.5.0", "jinja2>=3.0.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
pcap-triage = "pcap_triage.cli:main"

[tool.setuptools]
packages = ["pcap_triage", "pcap_triage.detectors", "pcap_triage.exporters"]

[tool.setuptools.package-data]
pcap_triage = ["templates/*.j2"]
